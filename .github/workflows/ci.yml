name: CI

on:
  push:
    branches: [main]
  pull_request:

# 読み取り以外の権限を持たせない。
permissions:
  contents: read

# 同じブランチで新しい変更が来たら、古い実行を止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # E2E用の、本物ではない値。まねたSupabaseにだけつながる。
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54999
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
      SUPABASE_SECRET_KEY: sb_secret_dummy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 型検査
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
      - name: ブラウザの準備
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run e2e
